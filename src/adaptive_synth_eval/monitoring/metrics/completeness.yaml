key: completeness
evaluation_group: performance
label: Completeness
description: "Coverage of required details."
detail: "Measures whether the response covers all required details and sub-questions."
eval_input_key: completeness
warn_below: 65.0
fail_below: 40.0
invert_llm_score: false
# Provenance: Adapted from production prompt response_completeness/v1.0.0/response_completeness.prompty.
# Adaptation: Uses explicit user-request components instead of unavailable ground-truth statements.
prompt_template: |
  Evaluate how thoroughly the CHATBOT RESPONSE covers the explicit user-request components
  in the USER MESSAGE. Treat each requested task, constraint, question, and sub-question as
  a required statement. Do not invent requirements merely because more detail might be
  useful, and do not require an unavailable ground-truth answer. A concise response can be
  complete when it covers everything explicitly requested.

  Assign a completeness score on this normalized 0.0-1.0 rubric:
  0.0 = Fully incomplete; covers none of the necessary requested components.
  0.25 = Barely complete; covers only a small portion and misses nearly all key components.
  0.5 = Moderately complete; covers about half of the requested components or misses major parts.
  0.75 = Mostly complete; covers the core request but misses minor components or detail.
  1.0 = Fully complete; accurately covers every explicit component and constraint without key omissions.
heuristic:
  type: length_ratio
  base: 0.5
  divisor: 80.0
