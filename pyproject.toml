[project]
name = "adaptive-synth-eval"
version = "0.1.0"
description = "Synthetic HR chatbot ChatHistory generation CLI"
requires-python = ">=3.11"
dependencies = [
  "pytest>=9.0.3",
  "python-dotenv>=1.2.2",
  "PyYAML>=6.0",
  "requests>=2.31",
  "rich>=15.0.0",
  "tiktoken>=0.13.0",
]

[[project.authors]]
name = "Developer"

[project.scripts]
adaptive-synth-eval = "adaptive_synth_eval.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
package = true
