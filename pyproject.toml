[project]
name = "adaptive-synth-eval"
version = "0.1.0"
description = "Synthetic HR chatbot ChatHistory generation CLI"
requires-python = ">=3.11"
dependencies = [
  "pytest>=9.0.3",
  "python-dotenv>=1.2.2",
  "PyYAML>=6.0",
  "requests>=2.31",
  "rich>=15.0.0",
  "tiktoken>=0.13.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "langchain-ollama>=0.3.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "azure-identity>=1.15.0",
  "prompt-toolkit>=3.0.47",
  "playwright>=1.40.0",
  "jsonpatch>=1.33",
]

[[project.authors]]
name = "Developer"

[project.scripts]
adaptive-synth-eval = "adaptive_synth_eval.cli:entrypoint"
ase = "adaptive_synth_eval.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
package = true
link-mode = "copy"
