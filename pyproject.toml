[project]
name = "adaptive-synth-eval"
version = "0.1.0"
description = "Synthetic HR chatbot ChatHistory generation CLI"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35.0",
  "botocore[crt]>=1.35.0",
  "anthropic>=0.40.0",
  "openai>=1.0.0",
  "pytest>=9.0.3",
  "python-dotenv>=1.2.2",
  "PyYAML>=6.0",
  "requests>=2.31",
  "rich>=15.0.0",
  "tiktoken>=0.13.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "langchain-ollama>=0.3.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "azure-identity>=1.15.0",
  "prompt-toolkit>=3.0.47",
  "playwright>=1.40.0",
  "jsonpatch>=1.33",
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn>=0.30.0",
]

[[project.authors]]
name = "Developer"

[project.scripts]
adaptive-synth-eval = "adaptive_synth_eval.cli:entrypoint"
ase = "adaptive_synth_eval.cli:entrypoint"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
# Ship the attack strategy catalog (loaded via importlib.resources at runtime).
"adaptive_synth_eval.adversarial_response_engine.engine" = ["*.yaml"]
"adaptive_synth_eval.adversarial_response_engine.skills" = [
  "catalog/*/SKILL.md",
  "catalog/*/references/*",
  "catalog/*/references/**/*",
  "catalog/*/assets/*",
  "catalog/*/assets/**/*",
]
"adaptive_synth_eval.monitoring.metrics" = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
package = true
link-mode = "copy"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
