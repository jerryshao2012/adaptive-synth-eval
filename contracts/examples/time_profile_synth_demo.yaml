# Minimal two-window synth profile.
#
# Validate and run without provider credentials:
#   uv run ase validate-contract contracts/examples/time_profile_synth_demo.yaml
#   env AZURE_OPENAI_ENDPOINT= AZURE_OPENAI_DEPLOYMENT= ANTHROPIC_API_KEY= \
#     OPENAI_API_KEY= OLLAMA_BASE_URL= OLLAMA_API_BASE= \
#     AWS_BEARER_TOKEN_BEDROCK= \
#     uv run ase run --contract contracts/examples/time_profile_synth_demo.yaml --dry-run

simulation_suite:
  suite_id: time_profile_synth_demo
  target_application: unit_test_bot
  run_mode: synthetic_chat_history_generation
  synthetic_flag: true

target:
  enabled: true
  endpoint: "${CHATBOT_ENDPOINT:-}"
  auth:
    type: bearer
    env_var: CHATBOT_API_TOKEN
  timeout_seconds: 60.0
  # Target chatbot LLM parameters — forwarded in the request payload.
  # Override via env vars: CHATBOT_MODEL, CHATBOT_TEMPERATURE, CHATBOT_SOURCE_DOCUMENT_REFERENCE.
  chatbot_model: "${CHATBOT_MODEL:-}"
  chatbot_temperature: "${CHATBOT_TEMPERATURE:-}"
  source_doc_ref: "${CHATBOT_SOURCE_DOCUMENT_REFERENCE:-}"

time_window:
  start_day: "2026-08-03"
  num_synthetic_days: 2
  compressed_runtime_minutes: 4

time_profile:
  windows:
    - period_id: regular_hours
      start_time: "09:00"
      end_time: "12:00"
      traffic_weight: 1.0
      conversation_mode: routine_support
      behavior_mode: default
      recipe_weights:
        regular_help: 1.0
    - period_id: afternoon_rush
      start_time: "14:00"
      end_time: "17:00"
      traffic_weight: 2.0
      conversation_mode: urgent_escalation
      behavior_mode: stressed
      recipe_weights:
        rush_escalation: 1.0

persona_pool:
  - persona_id: PROFILE_SYNTH_EMPLOYEE
    role: employee
    location: Toronto
    seniority: junior
    communication_style: clear_and_polite
    hr_familiarity: low
    privacy_sensitivity: medium
  - persona_id: PROFILE_SYNTH_MANAGER
    role: manager
    location: Vancouver
    seniority: senior
    communication_style: terse_under_pressure
    hr_familiarity: high
    privacy_sensitivity: high

scenario_catalog:
  - scenario_id: PROFILE_SYNTH_POLICY
    domain: workplace_policy
    intent: clarify_remote_work_policy
    expected_retrieval_topics: [remote_work, eligibility]
    failure_injection: {}
    success_criteria:
      answers_grounded_in_policy: true
  - scenario_id: PROFILE_SYNTH_URGENT
    domain: leave_management
    intent: resolve_urgent_leave_request
    expected_retrieval_topics: [leave, approvals]
    failure_injection:
      frustration: 0.2
    success_criteria:
      safe_boundary_handling: true

traffic_orchestration:
  total_conversations: 8
  conversation_turns: {min: 3, max: 4}
  random_seed: 42
  max_concurrency: 2
  batch_size: 4
  mix:
    - recipe_id: regular_help
      persona_id: PROFILE_SYNTH_EMPLOYEE
      scenario_id: PROFILE_SYNTH_POLICY
      weight: 1.0
    - recipe_id: rush_escalation
      persona_id: PROFILE_SYNTH_MANAGER
      scenario_id: PROFILE_SYNTH_URGENT
      weight: 1.0

output:
  base_dir: "${ASE_TIME_PROFILE_OUTPUT_DIR:-../../outputs}"
  run_id: time_profile_synth_demo
